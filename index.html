<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="src/output.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/09c41d8762.js" crossorigin="anonymous"></script>
    <script src="src/js/script.js" defer></script>
</head>
<body>
    <div class="card-container">
        <img class="card-image" src="https://i.ibb.co.com/CsK8jHVW/tailwindcss.jpg">
        <div class="card-view">12.5M</div>
        <div class="card-body">
            <h1>learn tailwindCSS</h1>
            <h4>deep dive into tailwindcss</h4>
        </div>
        <div class="card-actions">
            <button class="update-button">
                <i class="fa-regular fa-pen-to-square size-4 mr-2 lg:mr-0"></i>
                <span class="inline lg:hidden">Update</span>
            </button>
            <button class="delete-button">
                <i class="fa-solid fa-trash size-4 mr-2 lg:mr-0"></i>
                <span class="inline lg:hidden">Delete</span>
            </button>
        </div>
    </div>
</body>
</html>
